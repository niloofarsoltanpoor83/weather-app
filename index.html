<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<button id="themeBtn">🌙 Dark Mode</button>
<div class="weather-box">
    <h1>Weather App</h1>

    <input id="cityInput" type="text" placeholder="Enter city name">

    <button id="searchBtn">Search</button>
    <div class="favorite-section">

    <button id="favoriteBtn">
        ⭐ Add Favorite
    </button>

    <div id="favoriteCities"></div>

</div>
<button id="locationBtn">use My Location</button>
    <div id="weatherResult">
        <p id="updateTime"></p>
        
    </div>
<div id="forecastContainer">

    <h2>5-Day Forecast</h2>

    <div id="forecast"></div>

</div>

<h3>Hourly Forecast</h3>
    <div id="hourlyForecast"
        class="hourly-container"></div>
<script src="script.js"></script>
<div id="weatherAnimation"></div>
    
</body>
</html>
